# =============================================================================
# .pre-commit-config.yaml — Git Hook 配置模板
# 安装: pip install pre-commit && pre-commit install
# =============================================================================

repos:
  # ─── 通用检查 ───
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace        # 删除行尾空格
      - id: end-of-file-fixer          # 确保文件以换行结束
      - id: check-yaml                 # 验证 YAML 语法
      - id: check-json                 # 验证 JSON 语法
      - id: check-added-large-files    # 防止提交大文件
        args: ['--maxkb=500']
      - id: detect-private-key         # 检测私钥
      - id: check-merge-conflict       # 检查合并冲突标记

  # ─── 密钥扫描 ───
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets             # 扫描密钥泄露
        args: ['--baseline', '.secrets.baseline']

